<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Interface - Presence</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  margin:0;
  background:black;
  overflow:hidden;
  font-family: 'Courier New', Courier, monospace;
}
/* Intro screen */
#intro {
position:absolute;
width:100%;
height:100%;
background:black;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
color:white;
z-index: 10;
}

#enter {
padding:14px 36px;
border:1px solid rgba(255,255,255,0.3);
background:transparent;
color:white;
letter-spacing:2px;
cursor:pointer;
transition:0.3s;
font-family: inherit;
}
#enter:hover {
border-color:white;
background: rgba(255,255,255,0.1);
}

/* Subtle title */
#title {
position:absolute;
top:30px;
width:100%;
text-align:center;
font-size:12px;
letter-spacing:4px;
color:rgba(255,255,255,0.3);
}

/* Text Display */
#text {
position:absolute;
bottom:18%;
width:100%;
text-align:center;
color:white;
font-size:24px;
letter-spacing:1px;
opacity:0;
transition:opacity 0.8s ease;
text-shadow: 0 0 10px rgba(255,255,255,0.5);
pointer-events: none;
}
</style>
</head>
<body>

<div id="intro">
  <div id="title">INTERFACE</div>
  <button id="enter">INITIATE SEQUENCE</button>
</div>

<div id="text"></div>

<audio id="ambient" src="ambient.mp3" loop></audio>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const enter = document.getElementById("enter");
const intro = document.getElementById("intro");
const textDisplay = document.getElementById("text");
const ambient = document.getElementById("ambient");

let scene, camera, renderer, points;
let positions, targets;

/* SCENE SETUP (The Particle Face) */
function initScene() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.z = 9;

  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const count = 6000;
  positions = new Float32Array(count * 3);
  targets = new Float32Array(count * 3);

  for(let i=0; i<count; i++){
    positions[i*3] = (Math.random()-0.5)*40;
    positions[i*3+1] = (Math.random()-0.5)*40;
    positions[i*3+2] = (Math.random()-0.5)*40;

    let angle = Math.random()*Math.PI*2;
    let radius = 2 + Math.random()*2;
    targets[i*3] = Math.cos(angle)*radius;
    targets[i*3+1] = Math.sin(angle)*radius*1.5;
    targets[i*3+2] = (Math.random()-0.5)*0.5;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
  const mat = new THREE.PointsMaterial({ size:0.03, color: 0xffffff, transparent:true, opacity:0.8 });
  points = new THREE.Points(geo, mat);
  scene.add(points);
}

function animate(t){
  requestAnimationFrame(animate);
  let pos = points.geometry.attributes.position.array;
  for(let i=0; i<pos.length; i++){
    pos[i] += (targets[i] - pos[i]) * 0.015;
  }
  points.geometry.attributes.position.needsUpdate = true;
  points.rotation.y += 0.001;
  renderer.render(scene, camera);
}

/* SCRIPT DATA */
const script = [
  {t:0, txt:"Robert."},
  {t:4, txt:"You have carried more than was required."},
  {t:9, txt:"And you have called it strength."},
  {t:14, txt:"But not all weight is meant to remain."},
  {t:20, txt:"Do justly. Love mercy. Walk humbly."},
  {t:28, txt:"You understand the first."},
  {t:32, txt:"You resist the last."},
  {t:37, txt:"Because it requires release."},
  {t:42, txt:"Not control."},
  {t:48, txt:"Strength without direction becomes burden."},
  {t:55, txt:"Skill without purpose becomes weight."},
  {t:62, txt:"You are not unseen."},
  {t:68, txt:"You are being pressed toward clarity."},
  {t:75, txt:"Stand. Not in pride. In truth."}
];

/* LIVE VOICE ENGINE */
function speak(message) {
    const msg = new SpeechSynthesisUtterance(message);
    const voices = window.speechSynthesis.getVoices();
    // Try to find a deep male voice, otherwise use default
    msg.voice = voices.find(v => v.name.includes('Male') || v.name.includes('Google US English')) || voices[0];
    msg.pitch = 0.1; // Deepest possible pitch
    msg.rate = 0.75; // Slower, more cinematic speed
    msg.volume = 1;
    window.speechSynthesis.speak(msg);
}

/* TIMELINE CONTROLLER */
function runSequence() {
  let startTime = performance.now() / 1000;
  let spokenIndex = new Set();

  function update() {
    let elapsed = (performance.now() / 1000) - startTime;

    script.forEach((line, index) => {
      if (elapsed >= line.t && !spokenIndex.has(index)) {
        // Update Text
        textDisplay.style.opacity = 0;
        setTimeout(() => {
            textDisplay.innerText = line.txt;
            textDisplay.style.opacity = 1;
        }, 100);

        // Trigger Voice
        speak(line.txt);
        spokenIndex.add(index);
      }
    });

    if (spokenIndex.size < script.length) {
      requestAnimationFrame(update);
    }
  }
  update();
}

/* INITIALIZE ON CLICK */
enter.onclick = () => {
  intro.style.display = "none";
  initScene();
  animate();
  
  // Try to play ambient if file exists
  ambient.volume = 0.2;
  ambient.play().catch(() => console.log("Ambient file missing, skipping."));

  // Start the voice and text sequence
  runSequence();
};

// Pre-load voices for mobile browsers
window.speechSynthesis.getVoices();
</script>
</body>
</html>
