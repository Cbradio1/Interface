<!DOCTYPE html>
<html lang="en">
<head>

<title>INTERFACE</title>

<style>

.ititle{font-size:clamp(11px,2.8vw,15px);letter-spacing:9px;color:rgba(255,255,255,0.72);margin-bottom:52px;}
#enter{padding:18px 54px;border:1px solid rgba(255,255,255,0.42);background:transparent;

  box-shadow:0 0 36px rgba(255,255,255,0.07);}
.istatus{margin-top:46px;font-size:8px;letter-spacing:5px;color:rgba(0,255,65,0.45);}

.tl{top:32px;left:32px;border-top-width:1px;border-left-width:1px;}

  opacity:0;transition:opacity .7s ease;

/* CORNER HUD */

<body>
<canvas id="rain"></canvas>
<div id="vignette"></div>

<div class="chud hudbl">NEURAL/ACTIVE<br>SYS.PRESENCE<br>▸ INTERFACE</div>
<div class="chud hudbr">SEQUENCE/INIT<br>PARTICLE.MESH<br>VOICE ▸ ALIVE</div>

<div id="intro">
  <div class="cc tl"></div><div class="cc br2"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ———————————————————————————————————————————————————————
// MATRIX RAIN
// ———————————————————————————————————————————————————————
const rainCv=document.getElementById('rain'),rCtx=rainCv.getContext('2d');
const KANA='アイウエオカキクケコサシスセソ0110100101';
let rCols,rDrops,rainAlpha=1;const rSz=13;
function resizeRain(){
  rainCv.width=window.innerWidth;rainCv.height=window.innerHeight;
  rCols=Math.floor(rainCv.width/rSz);
  rDrops=Array.from({length:rCols},()=>Math.random()*-60);
}
resizeRain();window.addEventListener('resize',resizeRain);
(function loop(){
  rCtx.fillStyle=`rgba(0,0,0,${0.055+(1-rainAlpha)*0.2})`;
  rCtx.fillRect(0,0,rainCv.width,rainCv.height);
  rCtx.font=rSz+'px monospace';
  for(let i=0;i<rCols;i++){
    const bright=Math.random()>.94,a=rainAlpha*(bright?1:.65);
    rCtx.fillStyle=bright?`rgba(200,255,200,${a})`:`rgba(0,${Math.floor(130+Math.random()*110)},20,${a})`;
    rCtx.fillText(KANA[Math.floor(Math.random()*KANA.length)],i*rSz,rDrops[i]*rSz);
    if(rDrops[i]*rSz>rainCv.height&&Math.random()>.975)rDrops[i]=0;
    rDrops[i]++;
  }
  requestAnimationFrame(loop);
})();

// ———————————————————————————————————————————————————————
// WEB AUDIO ENGINE — ALIVE SETTINGS + PROXY FIX
// ———————————————————————————————————————————————————————
let audioCtx, masterGain, effectChainInput, droneStarted=false;

function buildImpulseResponse(duration, decay) {
  const len = audioCtx.sampleRate * duration;
  const buf = audioCtx.createBuffer(2, len, audioCtx.sampleRate);
  for(let ch=0; ch<2; ch++){
    const d = buf.getChannelData(ch);
    for(let i=0; i<len; i++){
      d[i] = (Math.random()*2-1) * Math.pow(1-i/len, decay) * Math.sin(i * 0.05);
    }
  }
  return buf;
}

function setupAudio(){
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 1.2;
  masterGain.connect(audioCtx.destination);
  effectChainInput = audioCtx.createGain();

  const bass = audioCtx.createBiquadFilter();
  bass.type = 'peaking'; bass.frequency.value = 75; bass.Q.value = 1.0; bass.gain.value = 12;

  const highCut = audioCtx.createBiquadFilter();
  highCut.type = 'lowpass'; highCut.frequency.value = 2800; highCut.Q.value = 0.7;

  const convolver = audioCtx.createConvolver();
  convolver.buffer = buildImpulseResponse(5, 2.0);

  const dryGain = audioCtx.createGain(); dryGain.gain.value = 0.5;
  const wetGain = audioCtx.createGain(); wetGain.gain.value = 0.6;

  effectChainInput.connect(bass);
  bass.connect(highCut);
  highCut.connect(dryGain);
  highCut.connect(convolver);
  dryGain.connect(masterGain);
  convolver.connect(wetGain);
  wetGain.connect(masterGain);

  function makeDrone(freq, vol){
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    const env = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.value = freq; env.gain.value = 0;
    osc.connect(g); g.connect(env); env.connect(masterGain);
    osc.start(); g.gain.value = vol; return env;
  }
  window._drone1 = makeDrone(48, 0.15); 
  window._drone2 = makeDrone(96, 0.05);
  window._droneRamp = () => {
    if(droneStarted) return; droneStarted=true;
    [window._drone1, window._drone2].forEach(d => d.gain.setTargetAtTime(1, audioCtx.currentTime, 3.0));
  };
}

async function speakWithEffects(text){
  // Proxy fix for GitHub Pages
  const proxy = "https://corsproxy.io/?";
  const ttsUrl = `https://api.streamelements.com/kappa/v2/speech?voice=Brian&text=${encodeURIComponent(text)}`;
  
  try{
    const res = await fetch(proxy + encodeURIComponent(ttsUrl));
    const buf = await res.arrayBuffer();
    const decoded = await audioCtx.decodeAudioData(buf);

    return new Promise(resolve=>{
      const src = audioCtx.createBufferSource();
      src.buffer = decoded;
      src.playbackRate.value = 0.82; // Alive Pitch
      src.connect(effectChainInput);
      src.start(0);
      src.onended = resolve;
    });
  }catch(err){
    console.error('Audio fetch error:', err);
    return new Promise(r => setTimeout(r, 2000));
  }
}

// ———————————————————————————————————————————————————————
// PARTICLE FACE & SCENE 
// ———————————————————————————————————————————————————————
let scene,camera,renderer,faceMesh,orbitMesh,fPos,fTgt,fCol,fReg;
const FACE_N=isMobile?6000:10000,ORBIT_N=280;

function buildFace(){
  const W=480,H=600,cv=document.createElement('canvas');
  cv.width=W;cv.height=H;const g=cv.getContext('2d');
  g.fillStyle='#000';g.fillRect(0,0,W,H);
  const S=fn=>{g.beginPath();fn();g.stroke();};
  const F=fn=>{g.beginPath();fn();g.fill();};
  g.strokeStyle='rgba(255,255,255,0.95)';g.lineWidth=5;
  S(()=>g.ellipse(240,290,150,195,0,0,Math.PI*2));
  g.strokeStyle='rgba(255,255,255,0.25)';g.lineWidth=1.5;
  S(()=>{g.moveTo(94,185);g.quadraticCurveTo(82,290,97,378);});
  S(()=>{g.moveTo(386,185);g.quadraticCurveTo(398,290,383,378);});
  g.strokeStyle='rgba(255,255,255,0.82)';g.lineWidth=4;
  S(()=>{g.moveTo(116,204);g.quadraticCurveTo(160,190,202,205);});
  S(()=>{g.moveTo(278,205);g.quadraticCurveTo(320,190,364,204);});
  g.strokeStyle='rgba(255,255,255,0.88)';g.lineWidth=3;
  S(()=>g.ellipse(158,238,40,23,0,0,Math.PI*2));
  S(()=>g.ellipse(322,238,40,23,0,0,Math.PI*2));
  g.strokeStyle='rgba(120,190,255,0.95)';g.lineWidth=2;
  S(()=>g.arc(158,238,20,0,Math.PI*2));
  S(()=>g.arc(322,238,20,0,Math.PI*2));
  g.fillStyle='#fff';
  F(()=>g.arc(158,238,10,0,Math.PI*2));
  F(()=>g.arc(322,238,10,0,Math.PI*2));
  g.strokeStyle='rgba(80,160,255,0.4)';g.lineWidth=1.2;
  S(()=>g.arc(158,238,29,0,Math.PI*2));
  S(()=>g.arc(322,238,29,0,Math.PI*2));
  g.strokeStyle='rgba(255,255,255,0.52)';g.lineWidth=2.2;
  S(()=>{g.moveTo(228,262);g.lineTo(215,330);g.lineTo(208,348);});
  S(()=>{g.moveTo(252,262);g.lineTo(265,330);g.lineTo(272,348);});
  S(()=>{g.moveTo(208,348);g.quadraticCurveTo(240,360,272,348);});
  g.strokeStyle='rgba(255,255,255,0.6)';g.lineWidth=2;
  S(()=>g.ellipse(210,354,14,8,-0.35,0,Math.PI*2));
  S(()=>g.ellipse(270,354,14,8,0.35,0,Math.PI*2));
  g.strokeStyle='rgba(255,255,255,0.82)';g.lineWidth=3;
  S(()=>{g.moveTo(176,400);g.quadraticCurveTo(208,390,240,392);g.quadraticCurveTo(272,390,304,400);});
  S(()=>{g.moveTo(176,400);g.quadraticCurveTo(240,428,304,400);});
  g.strokeStyle='rgba(255,255,255,0.3)';g.lineWidth=1.4;
  S(()=>{g.moveTo(176,400);g.lineTo(163,403);});
  S(()=>{g.moveTo(304,400);g.lineTo(317,403);});
  g.strokeStyle='rgba(255,255,255,0.48)';g.lineWidth=2.2;
  S(()=>{g.moveTo(132,356);g.quadraticCurveTo(118,432,156,460);
    g.quadraticCurveTo(196,478,240,480);g.quadraticCurveTo(284,478,324,460);
    g.quadraticCurveTo(362,432,348,356);});
  g.strokeStyle='rgba(255,255,255,0.18)';g.lineWidth=1.5;
  S(()=>{g.moveTo(100,278);g.quadraticCurveTo(118,324,140,342);});
  S(()=>{g.moveTo(380,278);g.quadraticCurveTo(362,324,340,342);});
  g.strokeStyle='rgba(255,255,255,0.58)';g.lineWidth=2;
  S(()=>g.arc(240,97,24,Math.PI*1.1,Math.PI*1.9));
  g.lineWidth=1.6;
  S(()=>{g.moveTo(228,86);g.lineTo(228,62);});
  S(()=>{g.moveTo(240,78);g.lineTo(240,52);});
  S(()=>{g.moveTo(252,86);g.lineTo(252,62);});
  g.fillStyle='rgba(255,255,255,0.72)';
  [[-18,118],[0,104],[18,118]].forEach(([dx,dy])=>{F(()=>g.arc(240+dx,dy,3,0,Math.PI*2));});
  g.strokeStyle='rgba(255,255,255,0.26)';g.lineWidth=1;
  S(()=>{g.moveTo(214,142);g.lineTo(214,163);g.lineTo(240,174);g.lineTo(266,163);g.lineTo(266,142);});
  [[65,1],[415,-1]].forEach(([x0,dir])=>{
    [130,182,234,286,338].forEach(y=>{
      g.strokeStyle='rgba(255,255,255,0.38)';g.lineWidth=1.2;
      S(()=>{g.moveTo(x0,y);g.lineTo(x0+dir*18,y);g.lineTo(x0+dir*24,y+10);g.lineTo(x0+dir*40,y+10);});
      g.fillStyle='rgba(255,255,255,0.65)';F(()=>g.arc(x0,y,3.2,0,Math.PI*2));
      g.strokeStyle='rgba(255,255,255,0.2)';
      S(()=>{g.moveTo(x0+dir*40,y+10);g.lineTo(x0+dir*50,y+10);});
    });
  });
  const px=g.getImageData(0,0,W,H).data,pts=[];
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const i=(y*W+x)*4;
    if(px[i]>65){
      let reg=0;
      if(y>380&&y<448&&x>162&&x<318) reg=1;
      if(y>210&&y<272&&((x>112&&x<204)||(x>276&&x<368))) reg=2;
      if(x<88||x>392) reg=3;
      pts.push((x/W-.5)*12,-(y/H-.5)*12,reg);
    }
  }
  return pts;
}

function initScene(){
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(55,window.innerWidth/window.innerHeight,0.1,1000);
  camera.position.z=14;
  renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.domElement.style.cssText='position:fixed;top:0;left:0;z-index:2;';
  document.getElementById('vignette').before(renderer.domElement);
  const raw=buildFace(),ptLen=raw.length/3;
  fPos=new Float32Array(FACE_N*3);fTgt=new Float32Array(FACE_N*3);
  fCol=new Float32Array(FACE_N*3);fReg=new Uint8Array(FACE_N);
  for(let i=0;i<FACE_N;i++){
    fPos[i*3]=(Math.random()-.5)*44;fPos[i*3+1]=(Math.random()-.5)*44;fPos[i*3+2]=(Math.random()-.5)*24;
    const ri=(i%ptLen)*3;
    fTgt[i*3]=raw[ri]+(Math.random()-.5)*.06;
    fTgt[i*3+1]=raw[ri+1]+(Math.random()-.5)*.06;
    fTgt[i*3+2]=(Math.random()-.5)*.55;
    const reg=raw[ri+2];fReg[i]=reg;
    if(reg===2){fCol[i*3]=.52;fCol[i*3+1]=.88;fCol[i*3+2]=1;}
    else if(reg===1){fCol[i*3]=1;fCol[i*3+1]=.8;fCol[i*3+2]=.5;}
    else if(reg===3){fCol[i*3]=.5;fCol[i*3+1]=1;fCol[i*3+2]=.6;}
    else{fCol[i*3]=.86;fCol[i*3+1]=.92;fCol[i*3+2]=1;}
  }
  const fGeo=new THREE.BufferGeometry();
  fGeo.setAttribute('position',new THREE.BufferAttribute(fPos,3));
  fGeo.setAttribute('color',new THREE.BufferAttribute(fCol,3));
  faceMesh=new THREE.Points(fGeo,new THREE.PointsMaterial({
    size:.048,vertexColors:true,transparent:true,opacity:.92,
    blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));
  scene.add(faceMesh);
  const oPos=new Float32Array(ORBIT_N*3),oGeo=new THREE.BufferGeometry();
  oGeo.setAttribute('position',new THREE.BufferAttribute(oPos,3));
  orbitMesh=new THREE.Points(oGeo,new THREE.PointsMaterial({
    size:.07,color:0x2277ff,transparent:true,opacity:.5,
    blending:THREE.AdditiveBlending,depthWrite:false}));
  scene.add(orbitMesh);
}

let formT=0,speaking=false,speakT=0;
function animateScene(){
  requestAnimationFrame(animateScene);
  const now=performance.now()*.001;
  formT=Math.min(1,formT+.003);
  speakT=speaking?Math.min(1,speakT+.08):Math.max(0,speakT-.05);
  const pos=faceMesh.geometry.attributes.position.array;
  const col=faceMesh.geometry.attributes.color.array;
  const spd=.006+formT*.016;
  for(let i=0;i<FACE_N;i++){
    const ix=i*3,iy=i*3+1,iz=i*3+2,r=fReg[i];
    pos[ix]+=(fTgt[ix]-pos[ix])*spd;
    pos[iy]+=(fTgt[iy]-pos[iy])*spd;
    pos[iz]+=(fTgt[iz]-pos[iz])*spd;
    if(r===2){const p=.45+.55*Math.sin(now*1.8+i*.02);col[ix]=.35+p*.65;col[iy]=.7+p*.3;col[iz]=1;}
    else if(r===1&&speakT>0){const w=Math.sin(now*14+i*.4)*speakT;pos[iy]+=w*.1;col[ix]=1;col[iy]=.55+.45*Math.abs(w);col[iz]=.3;}
    else if(r===3){const fl=.5+.5*(Math.random()>.97?Math.random():.72);col[ix]=.28+fl*.32;col[iy]=fl;col[iz]=.38+fl*.32;}
  }
  faceMesh.geometry.attributes.position.needsUpdate=true;
  faceMesh.geometry.attributes.color.needsUpdate=true;
  faceMesh.material.opacity=.88+speakT*.12;
  faceMesh.scale.setScalar(1+Math.sin(now*.72)*.013);
  faceMesh.rotation.y=Math.sin(now*.14)*.13;
  faceMesh.rotation.x=Math.sin(now*.09)*.04;
  const oa=orbitMesh.geometry.attributes.position.array;
  for(let i=0;i<ORBIT_N;i++){
    const ph=(i/ORBIT_N)*Math.PI*2+now*.28,r=6.2+Math.sin((i/ORBIT_N)*Math.PI*6)*.55;
    oa[i*3]=Math.cos(ph)*r;oa[i*3+1]=Math.sin(ph*(.4+Math.sin(i*.1)*.2))*r*.27;oa[i*3+2]=Math.sin(ph)*r*.48;
  }
  orbitMesh.geometry.attributes.position.needsUpdate=true;
  orbitMesh.rotation.z=now*.04;
  renderer.render(scene,camera);
}

// ———————————————————————————————————————————————————————
// SEQUENCE 
// ———————————————————————————————————————————————————————
const lines=[
  {txt:'Robert.',                                    pause:2000},
  {txt:'You have carried more than was required.',   pause:1400},
  {txt:'And you have called it strength.',           pause:1400},
  {txt:'But not all weight is meant to remain.',     pause:1700},
  {txt:'Do justly. Love mercy. Walk humbly.',        pause:2200},
  {txt:'You understand the first.',                  pause:1400},
  {txt:'You resist the last.',                       pause:1400},
  {txt:'Because it requires release.',               pause:1400},
  {txt:'Not control.',                               pause:2000},
  {txt:'Strength without direction becomes burden.', pause:1400},
  {txt:'Skill without purpose becomes weight.',      pause:1700},
  {txt:'You are not unseen.',                        pause:1800},
  {txt:'You are being pressed toward clarity.',      pause:1700},
  {txt:'Stand. Not in pride. In truth.',             pause:4000},
];

const ctextEl=document.getElementById('ctext');
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function showCaption(txt){
  ctextEl.style.opacity=0;
  return sleep(250).then(()=>{ctextEl.textContent=txt;ctextEl.style.opacity=1;});
}

async function runSequence(){
  await sleep(600); 
  if(window._droneRamp) window._droneRamp(); 
  for(const line of lines){
    showCaption(line.txt);
    speaking=true;
    await speakWithEffects(line.txt);
    speaking=false;
    await sleep(line.pause);
  }
  await sleep(1500);
  ctextEl.style.opacity=0;
}

// ———————————————————————————————————————————————————————
// INTRO 
// ———————————————————————————————————————————————————————
const introEl=document.getElementById('intro');
const statusEl=document.getElementById('statusLine');
const enterBtn=document.getElementById('enter');
const statuses=['NEURAL MESH LOADING','CALIBRATING MATRIX','VOICE CORE PRIMED','INTERFACE READY'];
let si=0;
const stInt=setInterval(()=>{
  si=Math.min(si+1,statuses.length-1);
  statusEl.textContent=statuses[si];
  if(si>=statuses.length-1)clearInterval(stInt);
},1200);

let started=false;
function handleEnter(){
  if(started)return;started=true;
  clearInterval(stInt);
  introEl.style.opacity='0';
  setTimeout(()=>{introEl.style.display='none';},1600);
  try{ setupAudio(); }catch(e){ console.warn('Audio setup failed:',e); }
  try{
    initScene();
    animateScene();
    const di=setInterval(()=>{rainAlpha=Math.max(.07,rainAlpha-.015);if(rainAlpha<=.07)clearInterval(di);},80);
    setTimeout(()=>{
      const fl=document.createElement('div');
      fl.style.cssText='position:fixed;inset:0;background:rgba(255,255,255,0.11);z-index:30;pointer-events:none;transition:opacity .65s';
      document.body.appendChild(fl);
      requestAnimationFrame(()=>requestAnimationFrame(()=>{fl.style.opacity='0';setTimeout(()=>fl.remove(),700);}));
    },2800);
  }catch(e){ console.error(e); }
  runSequence();
}

enterBtn.addEventListener('touchend',e=>{e.preventDefault();handleEnter();},{passive:false});
enterBtn.addEventListener('click',handleEnter);

window.addEventListener('resize',()=>{
  resizeRain();
  if(!renderer)return;
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
